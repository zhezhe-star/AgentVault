    evidence: "[2026-11-18T03:30:00+08:00] failover/冷却/恢复/耗尽测试全过；修复 rr 初值 bug，见 run-log M2-3（注：全耗尽当前中继最后上游状态 429，503 语义见 M3-4 熔断统一）"

